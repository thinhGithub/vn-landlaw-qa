chunking:
  strategy: adaptive_legal_structure
  preserve_article_context: true
  max_tokens: 512
  max_chars: 3200
  overlap_tokens: 64

retrieval:
  bm25_top_k: 20
  vector_top_k: 20
  final_top_k: 8
  fusion: rrf
  rrf_k: 60

generation:
  load_in_4bit: true
  max_new_tokens: 768
  temperature: 0.1
  require_citations: true
